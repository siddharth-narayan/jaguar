[package]
name = "jaguar-amdgpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

                           


#[profile.release]
#opt-level = 3
#debug = false
#split-debuginfo = '...'  # Platform-specific.
#strip = "none"
#debug-assertions = false
#overflow-checks = false
#lto = false
#panic = 'unwind'
#incremental = false
#codegen-units = 16
#rpath = false

#[profile.dev]
#opt-level = 0
#debug = true
#split-debuginfo = '...'  # Platform-specific.
#strip = "none"
#debug-assertions = true
#overflow-checks = true
#lto = false
#panic = 'unwind'
#incremental = true
#codegen-units = 256
#rpath = false

[dependencies]
amdgpu-device-libs = "0.2.0"
parser = { version = "0.1.0", path = "../parser" }
